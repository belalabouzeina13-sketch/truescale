  currency: { en: "EGP", ar: "ج.م" },

  // Share paid upfront for every order (0.5 = 50%). The rest is paid to unlock the final files.

    { id: "bathroom", code: "B-01", price: 1500, days: 4, payLink: "",

      scope: { en: "One TV wall up to 4 m wide · 3D render · execution drawing with dimensions · 1 revision.",
               ar: "حائط واحد حتى ٤ متر عرض · صورة 3D · رسم تنفيذي بالمقاسات · تعديل واحد." } },
    { id: "wardrobe", code: "W-01", price: 1000, days: 3, payLink: "",
      name:  { en: "Wardrobe", ar: "دولاب" },
      scope: { en: "One wardrobe · 3D render · inside layout & execution drawing with dimensions · 1 revision.",
               ar: "دولاب واحد · صورة 3D · تقسيم داخلي ورسم تنفيذي بالمقاسات · تعديل واحد." } },
    { id: "dressing", code: "D-01", price: 3000, days: 4, payLink: "", credit: true,
      name:  { en: "Dressing Room", ar: "غرفة ملابس" },
      scope: { en: "Up to 3 walls · 3D renders · shelving layout with dimensions · 1 revision.",
               ar: "حتى ٣ حوائط · صور 3D · توزيع الأرفف بالمقاسات · تعديل واحد." } }
  ],

  // Execution (no online price — client requests a site visit).

      name: { en: "Finishing Works", ar: "تشطيبات" },
      desc: { en: "Full apartment and villa finishing: plastering, electrical, plumbing, flooring, ceilings, paint.",
              ar: "تشطيب شقق وفيلات كامل: محارة، كهرباء، سباكة، أرضيات، أسقف، دهانات." } },
    { id: "exec-kitchen", code: "X-KT", credit: true,
      name: { en: "Kitchens", ar: "تنفيذ مطابخ" },
      desc: { en: "Manufactured to your design, delivered and installed.",
              ar: "تصنيع حسب تصميمك، توريد وتركيب." } },
    { id: "exec-dressing", code: "X-DR", credit: true,
      name: { en: "Dressing Rooms", ar: "تنفيذ غرف ملابس" },
      desc: { en: "Manufactured to your design, delivered and installed.",
              ar: "تصنيع حسب تصميمك، توريد وتركيب." } }
  ],

  // Per-square-meter work. Client sets the area, total = area × rate.
  perMeter: [
    { id: "2d",   code: "P-2D", rate: 50,  min: 50, days: 5,  payLink: "",
      name: { en: "2D Layout", ar: "توزيع 2D" },
      desc: { en: "Furniture layout for the whole unit.", ar: "توزيع الأثاث للوحدة كاملة." } },
    { id: "3d",   code: "P-3D", rate: 200, min: 50, days: 10, payLink: "",
      name: { en: "3D Interior", ar: "تصميم 3D" },
      desc: { en: "Full 3D design, realistic renders of every room.", ar: "تصميم 3D كامل بصور واقعية لكل الغرف." } },
    { id: "tech", code: "P-3T", rate: 250, min: 50, days: 14, payLink: "",
      name: { en: "3D + Technical Drawings", ar: "3D + رسومات تنفيذية" },
      desc: { en: "Full 3D design plus execution drawings: electrical, plumbing, ceilings, flooring.", ar: "تصميم 3D كامل مع رسومات تنفيذية: كهرباء، سباكة، أسقف، أرضيات." } }
  ],

  // Your work, shown near the top. Put images in design/work/.
  // w/h = image size in pixels; order = design it links to ("Order a design like this").
  portfolio: [
    { src: "work/tv-wall-marble.jpg",        w: 1184, h: 880,  order: "tv",       en: "TV wall — marble & walnut shelving",   ar: "حائط تليفزيون — رخام ومكتبة جوز" },
    { src: "work/bathroom-checkered.jpg",    w: 934,  h: 1400, order: "bathroom", en: "Guest bathroom — burgundy & checkered marble", ar: "حمام ضيوف — عنابي ورخام شطرنج" },
    { src: "work/dressing-room-walnut.jpg",  w: 958,  h: 1120, order: "dressing", en: "Dressing room — walnut, LED shelving", ar: "غرفة ملابس — جوز، إضاءة LED" },
    { src: "work/kitchen-burgundy-sink.jpg", w: 896,  h: 1152, order: "kitchen",  en: "Kitchen — burgundy zellige & wood",    ar: "مطبخ — زليج عنابي وخشب" },
    { src: "work/living-room-marble.jpg",    w: 1400, h: 1045, order: "3d",       en: "Living room — full 3D design",         ar: "ريسبشن — تصميم 3D كامل" },
    { src: "work/kitchen-compact.jpg",       w: 710,  h: 920,  order: "kitchen",  en: "Compact kitchen — oak & marble",       ar: "مطبخ صغير — أرو ورخام" },
    { src: "work/bathroom-vanity.jpg",       w: 843,  h: 1264, order: "bathroom", en: "Bathroom vanity — marble basin",       ar: "حوض حمام — رخام" },
    { src: "work/wardrobe-walnut-light.jpg", w: 976,  h: 1078, order: "wardrobe", en: "Wardrobe wall with hidden door",       ar: "حائط دواليب بباب مخفي" },
    { src: "work/kitchen-arch.jpg",          w: 586,  h: 1400, order: "kitchen",  en: "Kitchen through the arch",             ar: "مطبخ من ورا القوس" },
    { src: "work/wardrobe-walnut.jpg",       w: 976,  h: 1078, order: "wardrobe", en: "Wardrobe — walnut, full height",       ar: "دولاب — جوز، لحد السقف" }
  ]
};
</script>
<style>
:root{
  --paper:#efeae1;--paper-2:#e7e1d5;--ink:#191714;--ink-2:#55504a;--rule:rgba(25,23,20,.85);--hair:rgba(25,23,20,.16);
  --grid:rgba(25,23,20,.045);--red:#c8361f;--on-ink:#efeae1;
  --disp:"Archivo","Reem Kufi",sans-serif;--body:"Archivo","IBM Plex Sans Arabic",sans-serif;--mono:"IBM Plex Mono","IBM Plex Sans Arabic",monospace;
}
/* dark = blueprint */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f2a44;--paper-2:#123252;--ink:#e6eef6;--ink-2:#9fb6cc;--rule:rgba(230,238,246,.8);--hair:rgba(230,238,246,.18);
  --grid:rgba(230,238,246,.06);--red:#ff8a6b;--on-ink:#0f2a44;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0f2a44;--paper-2:#123252;--ink:#e6eef6;--ink-2:#9fb6cc;--rule:rgba(230,238,246,.8);--hair:rgba(230,238,246,.18);--grid:rgba(230,238,246,.06);--red:#ff8a6b;--on-ink:#0f2a44;color-scheme:dark}

*{box-sizing:border-box;border-radius:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
::selection{background:var(--red);color:var(--paper)}

.sheet{max-width:1120px;margin:0 auto;padding-inline:16px}
@media (min-width:760px){.sheet{padding-inline:32px}}
.mono{font-family:var(--mono);font-size:12px;font-weight:500}
html[lang="en"] .mono,html[lang="en"] .cap{text-transform:uppercase;letter-spacing:.08em}
.muted{color:var(--ink-2)}
.red{color:var(--red)}

/* top strip */
.strip{display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--rule);padding-block:12px}
.strip .id{display:flex;gap:10px;align-items:center;min-width:0}
.strip .id .mono{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.monogram{font-family:"Archivo",sans-serif;font-stretch:125%;font-weight:900;font-size:13px;border:1.5px solid var(--ink);padding:3px 6px;line-height:1;letter-spacing:.02em}
.langs{margin-inline-start:auto;display:flex;font-family:var(--mono);font-size:12px;font-weight:600}
.langs button{padding:4px 8px;border:1.5px solid var(--ink);color:var(--ink)}
.langs button+button{border-inline-start:0}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}

/* hero */
.hero{display:grid;gap:20px;padding-block:28px 36px;border-bottom:1.5px solid var(--rule)}
@media (min-width:860px){.hero{grid-template-columns:1.15fr .85fr;align-items:end;gap:40px;padding-block:56px 48px}}
.name{font-family:var(--disp);font-weight:800;line-height:.92;margin:0;font-size:clamp(44px,13vw,124px)}
html[lang="en"] .name{font-stretch:125%;text-transform:uppercase;letter-spacing:-.02em;font-size:clamp(40px,11.5vw,112px)}
html[lang="ar"] .name{font-weight:700;line-height:1.15}
.name{margin:0}
.logo{display:block;width:100%;max-width:640px;aspect-ratio:961/388;background:currentColor;-webkit-mask:url(assets/logo.svg) no-repeat center/contain;mask:url(assets/logo.svg) no-repeat center/contain}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lede{font-size:clamp(18px,4.6vw,22px);line-height:1.45;margin:18px 0 22px;max-width:30ch}
.btn{display:inline-flex;align-items:center;gap:12px;min-height:50px;padding:0 20px;background:var(--ink);color:var(--on-ink);font-weight:700;text-decoration:none;font-size:16px;border:1.5px solid var(--ink);transition:background .15s,color .15s}
.btn:hover{background:transparent;color:var(--ink)}
.btn .arr{font-family:var(--mono);font-weight:500}
html[dir="rtl"] .arr.flip{display:inline-block;transform:scaleX(-1)}
.btn.out{background:transparent;color:var(--ink)}
.btn.out:hover{background:var(--ink);color:var(--on-ink)}
.btn.wa{background:#167d43;border-color:#167d43;color:#fff}
.btn.wa:hover{background:transparent;color:var(--ink)}
.plan{width:100%;height:auto;color:var(--ink);display:block}
.plan .r{color:var(--red)}
.plan text{font-family:"IBM Plex Mono",monospace;font-size:9px;fill:currentColor}
.plan-cap{display:flex;justify-content:space-between;border-top:1px solid var(--hair);padding-top:6px;margin-top:4px}

/* section heads */
section{padding-block:36px 8px}
.shead{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;margin-bottom:18px}
.shead .no{font-family:var(--mono);font-size:13px;color:var(--red);font-weight:600}
.shead h2{margin:0;font-family:var(--disp);font-weight:800;font-size:clamp(26px,6vw,40px);line-height:1.1}
html[lang="en"] .shead h2{font-stretch:112%;text-transform:uppercase;letter-spacing:-.01em}
html[lang="ar"] .shead h2{font-weight:700}
.shead p{grid-column:2;margin:0;color:var(--ink-2)}

/* schedule (fixed packages) */
.sched{border-top:1.5px solid var(--rule)}
.sched-hd{display:none}
.row{position:relative;display:grid;grid-template-columns:52px 1fr auto;gap:2px 12px;padding:18px 0 20px;border-bottom:1px solid var(--hair);scroll-margin-top:24px;transition:background .3s}
.row .code{font-family:var(--mono);font-size:12px;font-weight:600;padding-top:7px}
.row .nm{font-family:var(--disp);font-weight:700;font-size:clamp(24px,6.4vw,34px);line-height:1.15;margin:0}
html[lang="en"] .row .nm{font-stretch:110%;text-transform:uppercase;letter-spacing:-.01em}
.row .pr{grid-column:3;grid-row:1;font-family:var(--mono);font-weight:600;font-size:clamp(17px,4.4vw,22px);text-align:end;white-space:nowrap;padding-top:4px}
.row .pr small{display:block;font-size:11px;font-weight:500;color:var(--ink-2)}
.row .sc{grid-column:2 / 4;margin:6px 0 12px;color:var(--ink-2);font-size:15px;max-width:60ch}
.row .act{grid-column:2 / 4;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.order{display:inline-flex;align-items:center;gap:10px;font-weight:700;border-bottom:2px solid var(--ink);padding:4px 0;font-size:16px}
.order:hover{color:var(--red);border-color:var(--red)}
.row.hit{background:color-mix(in srgb,var(--red) 9%,transparent)}
.stamp{position:absolute;inset-inline-end:0;top:-10px;transform:rotate(-4deg);border:2px solid var(--red);color:var(--red);font-family:var(--mono);font-weight:600;font-size:11px;padding:3px 8px;background:var(--paper);line-height:1.3;box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--red)}
html[dir="rtl"] .stamp{transform:rotate(4deg)}
@media (min-width:760px){
  .sched-hd{display:grid;grid-template-columns:72px 1fr 2fr 140px 150px;gap:16px;padding:8px 0;border-bottom:1px solid var(--hair)}
  .row{grid-template-columns:72px 1fr 2fr 140px 150px;gap:16px;align-items:start;padding:22px 0}
  .row .sc{grid-column:auto;margin:6px 0 0}
  .row .act{grid-column:auto;justify-content:flex-end;padding-top:6px}
  .row .pr{text-align:start;grid-column:auto;grid-row:auto}
  .stamp{inset-inline-end:auto;inset-inline-start:calc(72px + 16px);top:-11px}
}

/* scale ruler calculator */
.calc{border:1.5px solid var(--rule);background:var(--paper)}
.calc-top{padding:18px 16px 8px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--hair)}
.calc-top label{display:block;width:100%}
.area{display:flex;align-items:baseline;gap:8px;width:100%}
.area input{flex:1;min-width:0;width:100%;font-family:var(--disp);font-weight:800;font-size:clamp(56px,16vw,96px);line-height:1;border:0;border-bottom:2px solid var(--ink);background:transparent;padding:0;text-align:center;-moz-appearance:textfield}
html[lang="en"] .area input{font-stretch:125%}
.area input::-webkit-outer-spin-button,.area input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.area .u{font-family:var(--mono);font-size:20px;font-weight:600}
.ruler{padding:6px 16px 18px;border-bottom:1.5px solid var(--rule)}
.ruler input{width:100%;-webkit-appearance:none;appearance:none;height:34px;background:
  repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 10%) bottom/100% 14px no-repeat,
  repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 2%) bottom/100% 7px no-repeat;
  border-bottom:1.5px solid var(--ink);cursor:ew-resize;margin:0}
html[dir="rtl"] .ruler input{direction:ltr}
.ruler input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:34px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%)}
.ruler input::-moz-range-thumb{width:14px;height:34px;border:0;border-radius:0;background:var(--red);clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%)}
.ticks{display:flex;justify-content:space-between;direction:ltr;font-family:var(--mono);font-size:10px;color:var(--ink-2);margin-top:4px}
.mrow{display:grid;grid-template-columns:52px 1fr auto;gap:2px 12px;padding:16px;border-bottom:1px solid var(--hair);scroll-margin-top:24px;position:relative;transition:background .3s}
.mrow:last-child{border-bottom:0}
.mrow.hit{background:color-mix(in srgb,var(--red) 9%,transparent)}
.mrow .code{font-family:var(--mono);font-size:12px;font-weight:600;padding-top:4px}
.mrow h3{margin:0;font-size:19px;font-weight:700;line-height:1.3}
.mrow .d{grid-column:2 / 4;margin:2px 0 8px;font-size:14px;color:var(--ink-2)}
.mrow .tot{font-family:var(--mono);font-weight:600;font-size:clamp(18px,4.8vw,24px);text-align:end;white-space:nowrap}
.mrow .tot small{display:block;font-size:11px;font-weight:500;color:var(--ink-2)}
.mrow .act{grid-column:2 / 4;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
@media (min-width:760px){.calc{display:grid;grid-template-columns:340px 1fr}.calc-left{border-inline-end:1.5px solid var(--rule);display:flex;flex-direction:column;justify-content:space-between}.ruler{border-bottom:0}}

/* process — drawn as a dimension line */
.proc{list-style:none;margin:0;padding:0;display:grid;gap:0}
.proc li{display:grid;grid-template-columns:52px 1fr;gap:12px;padding-bottom:22px;position:relative}
.proc li::before{content:"";position:absolute;inset-inline-start:7px;top:22px;bottom:0;border-inline-start:1px solid var(--ink)}
.proc li:last-child::before{display:none}
.proc .n{font-family:var(--mono);font-size:12px;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.proc .n::before{content:"";width:15px;height:15px;border:1.5px solid var(--ink);background:var(--paper);flex:none;margin-top:2px;transform:rotate(45deg) scale(.75)}
.proc b{display:block;font-size:18px}
.proc p{margin:2px 0 0;color:var(--ink-2);font-size:15px}
@media (min-width:860px){
  .proc{grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);padding-top:0}
  .proc li{grid-template-columns:1fr;gap:6px;padding:0 20px 0 0;padding-top:18px}
  html[dir="rtl"] .proc li{padding:18px 0 0 20px}
  .proc li::before{display:none}
  .proc .n::before{position:absolute;top:-9px;inset-inline-start:-8px}
  .proc .n{padding-top:0}
}

/* portfolio */
.work{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:0 16px 10px;scrollbar-width:thin}
.work figure{margin:0;border:1.5px solid var(--rule);padding:8px;background:var(--paper);flex:none;scroll-snap-align:start;display:flex;flex-direction:column;max-width:82vw}
.work .zoom{display:block;cursor:zoom-in;padding:0}
.work img{display:block;height:400px;width:auto;max-width:100%;object-fit:cover;background:var(--paper-2)}
.work figcaption{display:flex;flex-direction:column;gap:2px;padding-top:10px;max-width:min(330px,80vw)}
.work .cap-t{font-weight:700;font-size:16px;line-height:1.35}
.work .order{align-self:flex-start;margin-top:6px;font-size:15px}
@media (min-width:860px){
  .work{display:block;columns:3;column-gap:16px;overflow:visible;margin:0;padding:0}
  .work figure{display:flex;break-inside:avoid;margin-bottom:16px;max-width:none}
  .work img{width:100%;height:auto;max-height:640px;object-fit:cover}
  .work figcaption{max-width:none}
}
.lb{position:fixed;inset:0;z-index:60;background:rgba(10,10,9,.92);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:calc(100vh - 80px);object-fit:contain;display:block}
.lb p{color:#efeae1;font-family:var(--mono);font-size:12px;margin:10px 0 0;text-align:center}

/* general notes */
.notes{margin:0;padding:0;list-style:none;counter-reset:n;columns:1;column-gap:40px}
@media (min-width:860px){.notes{columns:2}}
.notes li{break-inside:avoid;display:grid;grid-template-columns:34px 1fr;padding:12px 0;border-top:1px solid var(--hair);counter-increment:n}
.notes li::before{content:counter(n) ".";font-family:var(--mono);font-weight:600;font-size:13px;color:var(--red);padding-top:2px}
.notes b{display:block}
.notes span{color:var(--ink-2);font-size:15px}

/* custom request */
.custom{display:grid;gap:16px;border:1.5px solid var(--rule);padding:20px;margin-top:8px;background:var(--paper);position:relative}
.custom::before,.custom::after{content:"";position:absolute;width:12px;height:12px;border:1.5px solid var(--red)}
.custom::before{top:-7px;inset-inline-start:-7px;border-inline-end:0;border-bottom:0}
.custom::after{bottom:-7px;inset-inline-end:-7px;border-inline-start:0;border-top:0}
.custom h3{margin:0;font-family:var(--disp);font-size:24px;font-weight:700;line-height:1.2}
html[lang="en"] .custom h3{font-stretch:110%;text-transform:uppercase}
.custom p{margin:4px 0 0;color:var(--ink-2)}
@media (min-width:760px){.custom{grid-template-columns:1fr auto;align-items:center;padding:28px}}

/* title block footer */
.tblock{margin:44px 0 28px;border:1.5px solid var(--rule);display:grid;grid-template-columns:1fr 1fr;background:var(--paper)}
.tblock div{padding:10px 12px;border-bottom:1px solid var(--hair);min-width:0}
.tblock div:nth-child(odd){border-inline-end:1px solid var(--hair)}
.tblock .wide{grid-column:1 / -1;border-inline-end:0!important}
.tblock .k{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-2)}
html[lang="en"] .tblock .k{text-transform:uppercase;letter-spacing:.08em}
.tblock .v{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.tblock .big{font-family:var(--disp);font-size:22px;font-weight:800;line-height:1.1}
html[lang="en"] .tblock .big{font-stretch:120%;text-transform:uppercase}
.tblock div:nth-last-child(-n+2){border-bottom:0}
@media (min-width:760px){.tblock{grid-template-columns:2fr 1fr 1fr 1fr}.tblock .wide{grid-column:auto;border-inline-end:1px solid var(--hair)!important}.tblock div{border-bottom:0;border-inline-end:1px solid var(--hair)}.tblock div:last-child{border-inline-end:0}}

/* work order (checkout) */
.wo{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(15,14,12,.5)}
.wo[hidden]{display:none}
.wo-panel{width:100%;max-width:480px;height:100%;overflow-y:auto;background:var(--paper);border-inline-start:1.5px solid var(--rule);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  padding:0 20px calc(28px + env(safe-area-inset-bottom,0px));animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
html[dir="rtl"] .wo-panel{animation-name:slideR}
@keyframes slideR{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
.wo-hd{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1.5px solid var(--rule);margin-bottom:18px;z-index:1}
.wo-hd .x{margin-inline-start:auto;font-family:var(--mono);font-weight:600;font-size:13px;border:1.5px solid var(--ink);padding:5px 10px}
.wo h3{margin:0 0 2px;font-family:var(--disp);font-weight:800;font-size:30px;line-height:1.1}
html[lang="en"] .wo h3{font-stretch:115%;text-transform:uppercase}
.fl{display:block;margin-top:18px}
.fl .mono{display:block;color:var(--ink-2);margin-bottom:2px}
.fl input,.fl textarea{width:100%;border:0;border-bottom:1.5px solid var(--ink);background:transparent;padding:6px 0 8px;font-size:18px;outline:none}
.fl textarea{min-height:56px;resize:vertical;font-size:16px}
.fl input:focus,.fl textarea:focus{border-color:var(--red)}
.err{color:var(--red);font-size:14px;margin-top:10px;font-weight:600}
.lines{margin:24px 0 8px;border-top:1.5px solid var(--rule)}
.lines div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:15px}
.lines div span:last-child{font-family:var(--mono);font-weight:500;text-align:end}
.lines .due{border-bottom:1.5px solid var(--rule);font-weight:700;font-size:17px}
.lines .due span:last-child{font-size:20px;font-weight:600;color:var(--red)}
.payh{margin:24px 0 10px}
.paybox{display:grid;gap:10px}
.paybox .btn{justify-content:space-between;width:100%}
.manual{border:1.5px solid var(--rule);padding:4px 14px 14px}
.manual .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair)}
.manual code{font-family:var(--mono);font-weight:600;direction:ltr;unicode-bidi:embed}
.manual .cp{font-family:var(--mono);font-size:12px;font-weight:600;border-bottom:1.5px solid var(--ink);padding:2px 0}
.manual .btn{margin-top:12px}
.credit{display:block;margin-top:8px;color:var(--red);font-family:var(--mono);font-size:12px;font-weight:600}
html[lang="en"] .credit{text-transform:uppercase;letter-spacing:.06em}
.credit-note{border:1.5px solid var(--red);color:var(--red);padding:10px 12px;font-weight:700;margin:0 0 12px;font-size:15px}
.row .pr.q{font-size:14px;font-weight:500;color:var(--ink-2);white-space:normal}
.shot{display:block;margin-top:12px;border:1.5px dashed var(--ink);padding:12px;text-align:center;cursor:pointer}
.shot input{position:absolute;opacity:0;width:1px;height:1px}
.shot:focus-within{outline:2px solid var(--red)}
.fine{font-size:13px;color:var(--ink-2);margin:14px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

    woNo: "أمر شغل {id}", fName: "الاسم", fPhone: "الموبايل / واتساب", fNotes: "ملاحظات (اختياري)",
    errReq: "اكتب الاسم ورقم الموبايل.", errArea: "اكتب المساحة — أقل حاجة {n} م².",
    lService: "البند", lArea: "المساحة", lTotal: "الإجمالي", lDue: "المطلوب دلوقتي", lRest: "الباقي — لفتح الملفات",
    payH: "الدفع", payCard: "ادفع بالكارت", payWa: "ابعت الطلب على واتساب",
    instapay: "إنستاباي", vcash: "فودافون كاش", copy: "نسخ", copied: "اتنسخ",
    paid: "ابعت الطلب + صورة التحويل",
    attach: "+ أرفق صورة التحويل", errShot: "أرفق صورة تحويل إنستاباي.",
    payNote: "حوّل العربون بإنستاباي على الرقم اللي فوق، أرفق صورة التحويل، وبعدين ابعت. اختار واتساب — وتفاصيل الطلب هتتبعت معاها.",
    tStudio: "الاستوديو", tContact: "تواصل", tSheet: "لوحة", tDate: "التاريخ",
    waOrder: "أهلاً، أمر شغل {id}", waMethod: "الدفع", waPaid: "تم", waCustom: "أهلاً، عايز أسأل عن تصميم خاص.",
    latest: "من آخر فيديو"
  }
};

const $ = id => document.getElementById(id);
let lang = (() => { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'ar') return q;
  try { return localStorage.getItem('bazLang') || 'ar'; } catch(e) { return 'ar'; } })();
let area = 100;
const t = (k, v={}) => String(T[lang][k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x]);
const L = o => o[lang] ?? o.en;
const num = n => Math.round(n).toLocaleString('en-US');
const money = n => num(n) + ' ' + L(CONFIG.currency);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const waLink = s => `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(s)}`;
const ARR = '<span class="arr flip">→</span>';
const WA = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.8 11.9 11.9 0 004.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.4-.2z"/></svg>';

const pkgs = () => { const p = CONFIG.packages.filter(x => x.price != null); const i = p.findIndex(x => x.id === CONFIG.featured); if (i > 0) p.unshift(p.splice(i,1)[0]); return p; };
const dep = x => x.deposit ?? CONFIG.deposit;
const stamp = id => id === CONFIG.featured ? `<span class="stamp">${t('latest')}</span>` : '';

function renderMeter(){
  $('mList').innerHTML = CONFIG.perMeter.map(m => {
    const a = Math.max(area || 0, m.min), tot = a * m.rate;
    return `<div class="mrow" id="${m.id}">${stamp(m.id)}
      <span class="code">${m.code}</span>
      <h3>${esc(L(m.name))}</h3>
      <div class="tot">${money(tot)}<small>${t('perM',{r:num(m.rate)})}</small></div>
      <p class="d">${esc(L(m.desc))} <span class="mono">· ${t('min',{n:m.min})} · ${t('days',{n:m.days})}</span></p>
      <div class="act"><button class="order" type="button" data-order="${m.id}">${t('order')} ${ARR}</button>
        ${dep(m) < 1 ? `<span class="mono muted">${t('deposit',{p:Math.round(dep(m)*100)})} — ${money(tot*dep(m))}</span>` : ''}</div>
    </div>`; }).join('');
}

function render(){
  const h = document.documentElement; h.lang = lang; h.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  document.title = lang === 'ar' ? 'بلال أبوزينة ديزاين هاوس' : 'Belal Abouzeina Design House';

  $('pkList').innerHTML = pkgs().map(p => `
    <div class="row" id="${p.id}">${stamp(p.id)}
      <span class="code">${p.code}</span>
      <h3 class="nm">${esc(L(p.name))}</h3>
      <p class="sc">${esc(L(p.scope))}${p.credit ? `<span class="credit">${t('credit')}</span>` : ''}</p>
      <div class="pr">${money(p.price)}<small>${t('days',{n:p.days})}</small>${dep(p) < 1 ? `<small>${t('deposit',{p:Math.round(dep(p)*100)})}: ${num(p.price*dep(p))}</small>` : ''}</div>
      <div class="act"><button class="order" type="button" data-order="${p.id}">${t('order')} ${ARR}</button></div>
    </div>`).join('');

  $('exList').innerHTML = CONFIG.execution.map(x => `
    <div class="row" id="${x.id}">
      <span class="code">${x.code}</span>
      <h3 class="nm">${esc(L(x.name))}</h3>
      <p class="sc">${esc(L(x.desc))}${x.credit ? `<span class="credit">${t('credit')}</span>` : ''}</p>
      <div class="pr q">${t('visit')}</div>
      <div class="act"><button class="order" type="button" data-order="${x.id}">${t('reqVisit')} ${ARR}</button></div>
    </div>`).join('');
  renderMeter();
  $('proc').innerHTML = T[lang].proc.map(([b,p],i) => `<li><span class="n">0${i+1}</span><div><b>${esc(b)}</b><p>${esc(p)}</p></div></li>`).join('');
  $('notes').innerHTML = T[lang].notes.map(([b,s]) => `<li><div><b>${esc(b)}</b><span>${esc(s)}</span></div></li>`).join('');

  const hasWork = CONFIG.portfolio.length > 0;
  $('s4').hidden = !hasWork;
  if (hasWork) $('work').innerHTML = CONFIG.portfolio.map((w,i) => {
    const pk = CONFIG.packages.find(p => p.id === w.order && p.price != null) || CONFIG.perMeter.find(p => p.id === w.order);
    return `<figure>
      <button type="button" class="zoom" data-zoom="${i}" aria-label="${esc(L(w))}"><img src="${esc(w.src)}" alt="${esc(L(w))}" width="${w.w}" height="${w.h}" loading="${i < 2 ? 'eager' : 'lazy'}" decoding="async"></button>
      <figcaption><span class="mono muted">${t('fig',{n:i+2})}</span><span class="cap-t">${esc(L(w))}</span>
        ${pk ? `<button class="order" type="button" data-order="${pk.id}">${t('likeThis')} <span class="mono">${pk.code}</span> ${ARR}</button>` : ''}</figcaption>
    </figure>`; }).join('');
  document.querySelectorAll('main section:not([hidden]) .shead .no').forEach((el, i) => el.textContent = String(i + 1).padStart(2, '0'));

  $('customWa').href = waLink(t('waCustom')); $('customWa').innerHTML = WA + `<span>${t('wa')}</span>`;
  const phone = '+' + CONFIG.whatsapp;
  $('tblock').innerHTML = `
    <div class="wide"><span class="k">${t('tStudio')}</span><span class="logo" style="max-width:220px;margin-top:6px" role="img" aria-label="${esc(t('name1'))} ${esc(t('name2'))}"></span></div>
    <div><span class="k">${t('tContact')}</span><a class="v" href="https://wa.me/${CONFIG.whatsapp}" target="_blank" rel="noopener" dir="ltr">${phone}</a>${CONFIG.instagram ? `<br><a class="v" href="https://instagram.com/${encodeURIComponent(CONFIG.instagram)}" target="_blank" rel="noopener" dir="ltr">@${esc(CONFIG.instagram)}</a>` : ''}</div>
    <div><span class="k">${t('tSheet')}</span><span class="v mono">01 / 01</span></div>
    <div><span class="k">${t('tDate')}</span><span class="v mono">${new Date().getFullYear()}</span></div>`;
  if (!$('wo').hidden && cur) fillWO();
}

/* ---------- work order ---------- */
let cur = null, oid = '';
const find = id => { const p = CONFIG.packages.find(x => x.id === id); if (p) return {...p, kind:'pkg', deposit: p.deposit ?? CONFIG.deposit};
  const x = CONFIG.execution.find(e => e.id === id); if (x) return {...x, kind:'exec'};
  const m = CONFIG.perMeter.find(x => x.id === id); return m ? {...m, kind:'m2', deposit: m.deposit ?? CONFIG.deposit} : null; };
const woArea = () => { const a = parseFloat($('woArea').value); return isFinite(a) ? a : 0; };
const total = () => cur.kind === 'pkg' ? cur.price : Math.max(woArea(), cur.min) * cur.rate;
const due = () => total() * (cur.deposit ?? 1);

function fillWO(){
  $('woNo').textContent = t('woNo',{id:oid});
  $('woCode').textContent = cur.code;
  $('woTitle').textContent = L(cur.name);
  const ex = cur.kind === 'exec';
  $('woDays').textContent = ex ? t('visit') : t('days',{n:cur.days});
  $('woAreaF').hidden = cur.kind === 'pkg';
  $('woAreaF').querySelector('.mono').textContent = ex ? t('areaOpt') : t('areaL');
  $('woLocF').hidden = $('woRefF').hidden = !ex;
  $('execBox').hidden = !ex; $('exCredit').hidden = !cur.credit; $('exWa').innerHTML = WA;
  ['woLines','payH','payBox','payNote'].forEach(i => $(i).hidden = ex);
  if (ex) return;
  lines(); pay();
}
function lines(){
  let h = `<div><span>${t('lService')}</span><span>${cur.code} — ${esc(L(cur.name))}</span></div>`;
  if (cur.kind === 'm2') h += `<div><span>${t('lArea')}</span><span>${num(Math.max(woArea(),cur.min))} m² × ${num(cur.rate)}</span></div>`;
  h += `<div><span>${t('lTotal')}</span><span>${money(total())}</span></div>`;
  if (cur.deposit < 1) h += `<div><span>${t('lRest')}</span><span>${money(total()-due())}</span></div>`;
  h += `<div class="due"><span>${t('lDue')}</span><span>${money(due())}</span></div>`;
  $('woLines').innerHTML = h;
}
function pay(){
  let h = '';
  if (cur.payLink) h += `<button type="button" class="btn" data-pay="card"><span>${t('payCard')} — ${money(due())}</span>${ARR}</button>`;
  const man = [];
  if (CONFIG.instapay) man.push(['instapay', CONFIG.instapay]);
  if (CONFIG.vodafoneCash) man.push(['vcash', CONFIG.vodafoneCash]);
  if (man.length) h += `<div class="manual">${man.map(([k,v]) => `<div class="r"><span>${t(k)} <code>${esc(v)}</code></span><button type="button" class="cp" data-copy="${esc(v)}">${t('copy')}</button></div>`).join('')}
    <div class="r"><span>${t('lDue')}</span><code>${money(due())}</code></div>
    <label class="shot"><input type="file" accept="image/*" id="shot"><span class="mono" id="shotL">${t('attach')}</span></label>
    <button type="button" class="btn wa" style="width:100%;justify-content:space-between" data-pay="manual"><span>${t('paid')}</span>${WA}</button></div>`;
  if (!h) h = `<button type="button" class="btn wa" data-pay="wa"><span>${t('payWa')}</span>${WA}</button>`;
  $('payBox').innerHTML = h;
  $('payNote').hidden = !(cur.payLink || man.length);
}
function openWO(id){
  cur = find(id); if (!cur) return;
  oid = 'BAZ-' + Date.now().toString(36).slice(-5).toUpperCase();
  $('woArea').value = cur.kind === 'm2' ? (area || cur.min) : '';
  $('woErr').hidden = true;
  fillWO();
  $('wo').hidden = false; document.body.style.overflow = 'hidden';
  setTimeout(() => $('fName').focus({preventScroll:true}), 60);
}
function closeWO(){ $('wo').hidden = true; document.body.style.overflow = ''; }
function valid(){
  const e = $('woErr');
  if (cur.kind === 'm2' && woArea() < cur.min) { e.textContent = t('errArea',{n:cur.min}); e.hidden = false; $('woArea').focus(); return false; }
  if (cur.kind === 'exec' && !$('fLoc').value.trim()) { e.textContent = t('errLoc'); e.hidden = false; $('fLoc').focus(); return false; }
  if (!$('fName').value.trim() || $('fPhone').value.replace(/\D/g,'').length < 8) { e.textContent = t('errReq'); e.hidden = false; (!$('fName').value.trim() ? $('fName') : $('fPhone')).focus(); return false; }
  e.hidden = true; return true;
}
function msg(method){
  if (cur.kind === 'exec') {
    const l = [t('waExec',{id:oid}), `${t('lService')}: ${cur.code} — ${L(cur.name)}`, `${t('lLoc')}: ${$('fLoc').value.trim()}`];
    if (woArea() > 0) l.push(`${t('lArea')}: ${num(woArea())} m²`);
    if ($('fRef').value.trim()) l.push(`${t('lRef')}: ${$('fRef').value.trim()}`);
    l.push(`${t('fName')}: ${$('fName').value.trim()}`, `${t('fPhone')}: ${$('fPhone').value.trim()}`);
    if ($('fNotes').value.trim()) l.push(`${t('fNotes')}: ${$('fNotes').value.trim()}`);
    return l.join('\n');
  }
  const l = [t('waOrder',{id:oid}), `${t('lService')}: ${cur.code} — ${L(cur.name)}`];
  if (cur.kind === 'm2') l.push(`${t('lArea')}: ${num(Math.max(woArea(),cur.min))} m²`);
  l.push(`${t('lTotal')}: ${money(total())}`);
  if (cur.deposit < 1) l.push(`${t('lDue')}: ${money(due())}`);
  l.push(`${t('fName')}: ${$('fName').value.trim()}`, `${t('fPhone')}: ${$('fPhone').value.trim()}`);
  if ($('fNotes').value.trim()) l.push(`${t('fNotes')}: ${$('fNotes').value.trim()}`);
  if (method) l.push(`${t('waMethod')}: ${method}`);
  return l.join('\n');
}

/* ---------- events ---------- */
function setArea(v, from){
  area = Math.max(0, Math.min(2000, Math.round(v) || 0));
  if (from !== 'num') $('area').value = area || '';
  if (from !== 'rule') $('rule').value = Math.min(500, Math.max(20, area));
  renderMeter();
}
$('area').addEventListener('input', e => setArea(parseFloat(e.target.value), 'num'));
$('rule').addEventListener('input', e => setArea(parseFloat(e.target.value), 'rule'));
$('woArea').addEventListener('input', () => { if (cur && cur.kind !== 'exec') { lines(); pay(); } });
document.addEventListener('change', e => { if (e.target.id === 'shot') { const f = e.target.files[0]; $('shotL').textContent = f ? '✓ ' + f.name : t('attach'); $('woErr').hidden = true; } });
document.addEventListener('click', e => {
  const lb = e.target.closest('[data-lang]');
  if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('bazLang', lang); } catch(_){} render(); return; }
  const z = e.target.closest('[data-zoom]');
  if (z) { const w = CONFIG.portfolio[+z.dataset.zoom]; $('lbImg').src = w.src; $('lbImg').alt = L(w); $('lbCap').textContent = L(w); $('lb').hidden = false; return; }
  if (e.target.closest('#lb')) { $('lb').hidden = true; return; }
  const o = e.target.closest('[data-order]'); if (o) return openWO(o.dataset.order);
  const c = e.target.closest('[data-copy]');
  if (c) { navigator.clipboard?.writeText(c.dataset.copy).then(() => { c.textContent = t('copied'); setTimeout(() => c.textContent = t('copy'), 1500); }).catch(()=>{}); return; }
  const p = e.target.closest('[data-pay]');
  if (p) {
    if (!valid()) return;
    const k = p.dataset.pay;
    if (k === 'card') {
      window.open(cur.payLink, '_blank', 'noopener');
      if (!$('payBox').querySelector('[data-pay="after"]')) p.insertAdjacentHTML('afterend', `<button type="button" class="btn wa" data-pay="after"><span>${t('paid')}</span>${WA}</button>`);
      return;
    }
    const m = k === 'after' ? `${t('payCard')} — ${t('waPaid')}`
      : k === 'manual' ? [CONFIG.instapay && t('instapay'), CONFIG.vodafoneCash && t('vcash')].filter(Boolean).join(' / ') + ` — ${t('waPaid')}` : '';
    const text = msg(m), f = k === 'manual' && $('shot')?.files[0];
    if (k === 'manual' && !f) { const e = $('woErr'); e.textContent = t('errShot'); e.hidden = false; return; }
    if (f && navigator.canShare?.({files:[f]})) {
      navigator.clipboard?.writeText(text).catch(()=>{});
      navigator.share({files:[f], text}).catch(err => { if (err.name !== 'AbortError') window.open(waLink(text), '_blank', 'noopener'); });
    } else window.open(waLink(text), '_blank', 'noopener');
    return;
  }
  if (e.target === $('wo') || e.target.closest('#woClose')) closeWO();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('lb').hidden) $('lb').hidden = true; else if (!$('wo').hidden) closeWO(); } });
$('woForm').addEventListener('submit', e => e.preventDefault());

/* Deep links: .../design/#kitchen highlights the row; ?order=kitchen opens the work order. */
function deep(){
  const q = new URLSearchParams(location.search).get('order');
  const id = (q || location.hash.slice(1)).toLowerCase();
  const el = id && document.getElementById(id);
  if (!el || !(el.classList.contains('row') || el.classList.contains('mrow'))) return;
  el.scrollIntoView({block:'center'}); el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 2400);
  if (q) openWO(id);
}
render();
window.addEventListener('hashchange', deep);
deep();
</script>
</body>
</html>
